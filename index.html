<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeMania - Ek Gaming Katha</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="body">
        <img src="snake.png" alt="Snake" class="decorative-snake-img">
        <div class="decorative-snake">SNAKE MANIA</div>
        <div class="game-area">
            <div class="score-container">
                <div id="scoreBox">Score: 0</div>
                <div id="hiscoreBox">HiScore: 0</div>
            </div>
            <div id="board"></div>
        </div>
        <div class="controls">
            <div class="control-row">
                <div class="control-btn" id="upBtn">↑</div>
            </div>
            <div class="control-row">
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="downBtn">↓</div>
                <div class="control-btn" id="rightBtn">→</div>
            </div>
        </div>
        <div class="developer-credit">Developer By Amit Das</div>
    </div>
    <script src="js/index.js"></script>
</body>

</html>
